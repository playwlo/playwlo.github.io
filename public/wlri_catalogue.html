<html>
    <head>
        <link rel="stylesheet" type="text/css" href="data/catalogue.css">
        <title>WLRI CATALOGUE</title></head>
    <body>
        <select id="dropdown1" onchange="loadWearables(this.value)">
            <option value="0">Select wearables</option>
            <option value="arm">arm</option>
            <option value="body">body</option>
            <option value="hand">hand</option>
            <option value="head">head</option>
            <option value="shoes">shoes</option>
            <option value="special">special</option>
        </select>
        <select id="dropdown2" onchange="loadFurnitures(this.value)">
            <option value="0">Select furniture</option>
            <option value="tentShape">TENT SHAPE</option>
            <option value="animals">animals</option>
            <option value="bins">bins</option>
            <option value="carpets">carpets</option>
            <option value="celebrations">celebrations</option>
            <option value="decorations">decorations</option>
            <option value="gadgets">gadgets</option>
            <option value="fences">fences</option>
            <option value="flooring">flooring</option>
            <option value="flowers">flowers</option>
            <option value="kitchen">kitchen</option>
            <option value="lights">lights</option>
            <option value="maids">maids</option>
            <option value="partitions">partitions</option>
            <option value="shelves">shelves</option>
            <option value="sitables">sitables</option>
            <option value="statues">statues</option>
            <option value="tables">tables</option>
            <option value="toilet">toilet</option>
            <option value="wall decors">wall decors</option>
            <option value="wallpapers">wallpapers</option>
            <option value="windows">windows</option>
        </select>
        <select id="dropdown3" onchange="loadVehicles(this.value)">
            <option value="0">Select vehicle</option>
            <option value="land">land</option>
            <option value="air">air</option>
            <option value="water">water</option>
        </select>
        <select id="dropdown4" onchange="loadNPC(this.value)">
            <option value="0">Select npc</option>
            <option value="animals">animals</option>
            <option value="npc">npc</option>
            <option value="others">others</option>
            <option value="pets">pets</option>
        </select>
        <button onclick="loadMap()">Maps</button>
        <label id="maptip">Hover/Click on building icons / brown wheels</label>
        <p></p>
        <div id="scrollbox">
            <ul class="icons" id="UL"></ul>
            <div id="mapbox">
                <div id="pointsLayer"></div>
                <img src="assets/map/World_map.webp" style="user-select: none;"/>
            </div>
        </div>
        <dialog id="mapDialog">
            <p id="labelText">No map selected</p>
            <form method="dialog">
                <button onclick="closeDialog()">OK</button>
            </form>
        </dialog>
        

        <script src="data/catalogue.js"></script>
        <script>
            const SB = document.getElementById("scrollbox");
            const UL = document.getElementById("UL");
            const MB = document.getElementById("mapbox");
            const PL = document.getElementById("pointsLayer");
            const MT = document.getElementById("maptip");
            const LT = document.getElementById("labelText");
            const MD = document.getElementById("mapDialog");
            function refreshScrollboxSize(){SB.style.height = (window.innerHeight - SB.getBoundingClientRect().top - 10) +'px';}
          
            function showMapView(yes)
            {
                if(yes){
                    document.getElementById("dropdown1").value = 0;
                    document.getElementById("dropdown2").value = 0;
                    document.getElementById("dropdown3").value = 0;
                    document.getElementById("dropdown4").value = 0;
                    SB.scrollTop = 0;
                    UL.innerHTML = "";
                    MB.style.display = "flex";
                    MT.style.visibility = "visible";
                }
                else{
                    MB.style.display = "none";
                    MT.style.visibility = "hidden";
                }
            }
            function showDialog(str){LT.innerHTML = str; MD.showModal();}
            function closeDialog(){MD.close();}
            function loadWearables(cat)
            {
                showMapView(false);
                document.getElementById("dropdown2").value = 0;
                document.getElementById("dropdown3").value = 0;
                document.getElementById("dropdown4").value = 0;
                SB.scrollTop = 0;
                UL.innerHTML = "";
                if(cat=='0') return;
                let array = wearables[cat];
                for(let row of array)
                {
                    let li = document.createElement("li");
                    li.innerHTML =  "<div><img src='assets/icons/"+row['icon']+".png'></div>"+
                                    "<h4>"+row['id']+"</h4>"+
                                    "<p>"+row['name']+"</p>";
                    UL.appendChild(li);
                }
            }
            function loadFurnitures(cat)
            {
                showMapView(false);
                document.getElementById("dropdown1").value = 0;
                document.getElementById("dropdown3").value = 0;
                document.getElementById("dropdown4").value = 0;
                SB.scrollTop = 0;
                UL.innerHTML = "";
                if(cat=='0') return;
                let array = furnitures.ary;
                for(let row of array)
                {
                    if(row['c'] != cat) continue;
                    let li = document.createElement("li");
                    li.innerHTML =  "<div><img src='assets/tent/groups/"+cat+"/"+row['icon']+".png'></div>"+
                                    "<h4>"+row['id']+"</h4>"+
                                    "<p>"+row['name']+"</p>";
                    UL.appendChild(li);
                }
            }
            function loadVehicles(cat)
            {
                showMapView(false);
                document.getElementById("dropdown1").value = 0;
                document.getElementById("dropdown2").value = 0;
                document.getElementById("dropdown4").value = 0;
                SB.scrollTop = 0;
                UL.innerHTML = "";
                if(cat=='0') return;
                let array = vehicles.ary;
                for(let row of array)
                {
                    if(row['c'] != cat) continue;
                    let li = document.createElement("li");
                    li.innerHTML =  "<div><img src='assets/tent/groups/vehicle/"+row['ic']+".png'></div>"+
                                    "<h4>"+row['id']+"</h4>"+
                                    "<p>"+row['n']+"</p>";
                    UL.appendChild(li);
                }
            }
            function loadNPC(cat)
            {
                showMapView(false);
                document.getElementById("dropdown1").value = 0;
                document.getElementById("dropdown2").value = 0;
                document.getElementById("dropdown3").value = 0;
                SB.scrollTop = 0;
                UL.innerHTML = "";
                if(cat=='0') return;
                let array = npc.ary;
                for(let row of array)
                {
                    if(row['c'] != cat) continue;
                    let li = document.createElement("li");
                    li.innerHTML =  "<div><img src='assets/icons/npc/"+cat+"/"+row['ic']+".png'></div>"+
                                    "<h4>"+row['i']+"</h4>"+
                                    "<p>"+row['n']+"</p>";
                    UL.appendChild(li);
                }
            }

            function loadMap()
            {
                showMapView(true);
                //load hover points
                for(let row of mapPoints.ary)
                {
                    let label = document.createElement("label");
                    label.className = "hoverPoints";
                    label.style.width = "12px";
                    label.style.height = "12px";
                    label.style.left = (row['x']-6)+"px";
                    label.style.top = (row['y']-6)+"px";
                    let text = row['n']+": "+row['i'];
                    label.title = text;
                    label.onclick = function(){showDialog(text);};
                    PL.appendChild(label);//console.log("added label");
                }
            }

            window.onresize = function(){refreshScrollboxSize();}
            refreshScrollboxSize();
            showMapView(false);
        </script>
    </body>
</html>
